<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by the value of `--base-href` passed to
    `flutter build web` (CI sets it for GitHub Pages).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Notes, checklists and photos that sync across Android, Windows and the web.">
  <meta name="theme-color" content="#FCFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Notebook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Universal Notebook</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FCFAF7; }
    @media (prefers-color-scheme: dark) { html, body { background: #171614; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      transition: opacity 250ms ease;
    }
    #splash img { width: 76px; height: 76px; border-radius: 18px; }
    #splash .bar {
      width: 120px; height: 3px; border-radius: 3px; overflow: hidden;
      background: rgba(184, 82, 15, 0.18); position: relative;
    }
    #splash .bar::after {
      content: ""; position: absolute; inset: 0; width: 40%;
      background: #B8520F; border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Universal Notebook">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
