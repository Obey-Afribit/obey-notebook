name: universal_notebook
description: Offline-first universal notebook for Android, Windows, and the web.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend (cloud auth + sync). Pure-Dart SDK: builds cleanly on
  # Windows/Web/Android, no native C++ SDK required.
  supabase_flutter: ^2.8.0

  # Local-first storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.5

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  provider: ^6.1.2
  http: ^1.2.2
  collection: ^1.19.1

  # Features
  share_plus: ^10.0.2
  file_picker: ^8.1.0
  image_picker: ^1.1.2
  pdf: ^3.11.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0
  flutter_markdown_plus: ^1.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/templates/

# App icon (secretary bird). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#262626"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#262626"
    theme_color: "#17B3A6"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
